<rect x="32" y="54" width="356" height="74" rx="12" fill="white" stroke="#d6e4e9"/><rect x="32" y="70" width="4" height="42" rx="2" fill="#168b80"/><text x="52" y="83" class="dataset">ASD-Kinect</text><text x="52" y="108" class="task">ASD / typical development</text><rect x="412" y="54" width="356" height="74" rx="12" fill="white" stroke="#d6e4e9"/><rect x="412" y="70" width="4" height="42" rx="2" fill="#3866bc"/><text x="432" y="83" class="dataset">ATAXIA</text><text x="432" y="108" class="task">Normal / imitated ataxia</text><rect x="792" y="54" width="356" height="74" rx="12" fill="white" stroke="#d6e4e9"/><rect x="792" y="70" width="4" height="42" rx="2" fill="#8a65a4"/><text x="812" y="83" class="dataset">CARE-PD</text><text x="812" y="108" class="task">UPDRS gait score 0–3</text><rect x="32" y="142" width="356" height="74" rx="12" fill="white" stroke="#d6e4e9"/><rect x="32" y="158" width="4" height="42" rx="2" fill="#168b80"/><text x="52" y="171" class="dataset">GMFCS</text><text x="52" y="196" class="task">Cerebral palsy · levels I–IV</text><rect x="412" y="142" width="356" height="74" rx="12" fill="white" stroke="#d6e4e9"/><rect x="412" y="158" width="4" height="42" rx="2" fill="#3866bc"/><text x="432" y="171" class="dataset">PARKINSONISM</text><text x="432" y="196" class="task">Low / high motor severity</text><rect x="792" y="142" width="356" height="74" rx="12" fill="white" stroke="#d6e4e9"/><rect x="792" y="158" width="4" height="42" rx="2" fill="#8a65a4"/><text x="812" y="171" class="dataset">PATHOGAIT</text><text x="812" y="196" class="task">Six performed gait patterns</text><path d="M590 221V252" class="edge"/>
