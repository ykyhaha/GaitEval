<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="860" viewBox="0 0 1180 860" role="img" aria-labelledby="title desc">
<title id="title">GaitEval benchmark overview</title><desc id="desc">Six dataset-specific tasks provide pose sequences. Pose-derived numerical features, coordinate text and motion summaries are evaluated using feature-matched linear references and text-only language models. Outputs are scored in each native label space.</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f2faf8"/><stop offset="1" stop-color="#f0f5ff"/></linearGradient>
<linearGradient id="ribbon"><stop stop-color="#147d83"/><stop offset="1" stop-color="#3866bc"/></linearGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#a5bfc5" opacity=".23"/></pattern>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1L6 4L1 7" fill="none" stroke="#7e99ac" stroke-width="1.5"/></marker>
<marker id="blue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1L6 4L1 7" fill="none" stroke="#4775be" stroke-width="1.5"/></marker>
<marker id="green" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1L6 4L1 7" fill="none" stroke="#168b80" stroke-width="1.5"/></marker>
<g id="person" fill="none" stroke="currentColor" stroke-width="3.3" stroke-linecap="round" stroke-linejoin="round"><circle cx="0" cy="-41" r="7" fill="white"/><path d="M0-33L-2-7M-12-25L11-22M-12-25L-21-8L-27 2M11-22L17-7L25 0M-2-7L-10 13L-19 32M-2-7L9 13L16 33"/><circle cx="-2" cy="-7" r="3.5" fill="currentColor" stroke="none"/><circle cx="-12" cy="-25" r="2.6" fill="currentColor" stroke="none"/><circle cx="11" cy="-22" r="2.6" fill="currentColor" stroke="none"/></g>
</defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#183c50}.eyebrow{font-size:13px;font-weight:700;letter-spacing:2px;fill:#547484}.dataset{font-size:22px;font-weight:700}.task{font-size:16px;fill:#506c7c}.label{font-size:21px;font-weight:700}.sub{font-size:16px;fill:#506c7c}.small{font-size:14px;fill:#607c8b}.edge{fill:none;stroke:#7e99ac;stroke-width:2;marker-end:url(#arrow)}</style>
<rect width="1180" height="860" rx="24" fill="url(#bg)"/><rect width="1180" height="860" rx="24" fill="url(#dots)"/>
