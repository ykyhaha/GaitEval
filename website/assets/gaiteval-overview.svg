<text x="270" y="792" style="fill:white;font-size:23px;font-weight:700">Accuracy</text><text x="466" y="792" style="fill:white;font-size:23px;font-weight:700">Fixed-label macro-F1</text><text x="814" y="792" style="fill:white;font-size:23px;font-weight:700">Cohen’s κ</text>
